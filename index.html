<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你的分手人格图鉴</title>
<link rel="stylesheet" href="assets/crayon.css">
</head>
<body data-theme="breakup">
<main class="wrap">

  <section id="s-start">
    <header class="masthead">
      <span class="kicker" id="kicker"></span>
      <h1 id="title"></h1>
      <p class="lede" id="intro"></p>
      <div class="meta">
        <span><b id="qTotal">14</b> <span id="qUnit">题</span></span>
        <span>约 4 分钟</span>
        <span>无标准答案</span>
      </div>
    </header>
    <div class="card">
      <span class="tape"></span>
      <p class="lede" id="startNote"></p>
      <button class="btn" id="start"><span id="startLabel"></span> ✏️</button>
    </div>
  </section>

  <section id="s-quiz" class="hidden">
    <div class="card">
      <span class="tape tl"></span>
      <div class="progress">
        <span class="num" id="pnum"></span>
        <span class="bar"><i class="fill" id="pfill" style="width:7%"></i></span>
      </div>
      <span class="qtag" id="qtag"></span>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn prev" id="prevBtn">← 上一题</button>
        <button class="btn" id="nextBtn"><span class="lbl">下一题</span> →</button>
      </div>
    </div>
  </section>

  <section id="s-result" class="hidden">
    <div class="card">
      <span class="tape tr"></span>
      <div class="result-head">
        <div class="plate" id="plate"></div>
        <span class="rcode" id="rcode"></span>
        <div class="rname" id="rname"></div>
        <div class="rtag" id="rtag"></div>
      </div>
      <p class="portrait" id="portrait"></p>
      <div class="detail" id="rdetail"></div>
      <div class="match" id="rmatch"></div>
      <div class="quote" id="rquote"></div>
      <div class="bars">
        <div class="bars-title">四型得分分布</div>
        <div id="rbars"></div>
      </div>
      <div class="cta" id="rcta"></div>
      <p class="disclaim" id="disclaimer"></p>
      <button class="btn ghost" id="again">↺ 再测一次</button>
    </div>
  </section>

  <div class="footer">图鉴系列 · 分手人格图鉴<br>趣味自测 · 不构成诊断</div>
</main>

<script>
window.QUIZ = {

      detail:[

        ["怎么对自己更好", ["允许自己现在就痛一点，别等一年后集中补上","找一个能说话的人，把「我没事」换成「我其实不太好」"]],

      detail:[

        ["为什么会这样", "分手后依恋系统不会自动关闭，被激活时你只会越来越想回到那个人身边——反复复合是规律，不是你没出息。"],
        ["怎么对自己更好", ["趁理智时写下「必须分手的原因」，想联系时先读一遍再等 30 分钟","给「立刻行动」加一道延迟——延迟不是忍，是把决定挪出警报期"]],
        ["要警惕", "记忆会在分手时骗你：你只记得 TA 的好。那份「他其实很好」是症状，不是事实。"]

      match:{ best:"一个能给你明确答案的人——TA 的确定，能关掉你反复响的警报器。", worst:"一个忽冷忽热的人——你们会一起把「复合」演上一年。" },

      detail:[
        ["你平时会这样", ["保留所有聊天记录和合照","反复回看过去的对话","偷偷看 TA 的主页和点赞","幻想某天 TA 会回来"]],

  },

    { tag:"第 1 题 · 那天", text:"分手那天晚上，你的第一反应是？",
      opts:[ {label:"照常过日子，谁都看不出来", scores:{fr:2}}, {label:"忍不住发消息、想挽回", scores:{bo:2}}, {label:"把所有聊天记录翻出来看一遍", scores:{co:2}}, {label:"立刻删光拉黑，把行程排满", scores:{bu:2}} ] },
